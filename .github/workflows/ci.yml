name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # pandas is pinned to 1.3.5 in requirements.txt (Python 3.8-era); CI
      # installs a modern pandas first and excludes the stale pin so the
      # matrix actually runs on 3.11/3.12.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=1.5,<2.3" pytest pytest-cov httpx
          grep -v '^pandas' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Run astock test suite
        run: python -m pytest tests/apps/astock -q
